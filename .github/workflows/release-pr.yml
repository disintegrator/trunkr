name: Release PR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: [.bumper/bump-*.md]

jobs:
  upsert-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
          env: false

      - name: Commit pending bumps
        id: bumper
        shell: bash
        run: |
          groups=$(mise exec -- bumper commit)
          if [ -z "$groups" ]; then
            echo "No pending bumps to commit. Exiting."
            exit 0
          fi

          notes_file="$(mktemp)"
          for group in $groups; do
            latest_version=$(mise exec -- bumper current --group "$group")
            mise exec -- bumper cat --group "$group" --version "$latest_version" >> "$notes_file"
            echo "" >> "$notes_file"
          done

          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ steps.bumper.outputs.committed == 'true' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "chore: bumper commit"
          branch: gha/bumper-release
          delete-branch: true
          title: "chore: release packages"
          body-path: ${{ steps.bumper.outputs.notes_file }}
