name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Bumper tracks the trunkr version in herdr-plugin.toml (see
    # .bumper/config.toml), so a merged release PR shows up as a change here.
    paths: [herdr-plugin.toml]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-cli:
    runs-on: ubuntu-latest
    permissions:
      # So we can push tags
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No setup-go: mise-action puts its shims dir on PATH even with
      # env: false, so goreleaser's default `go` resolves to the
      # mise.toml-pinned Go.
      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          cache: true
          env: false

      - name: Read version and release notes from Bumper
        id: bumper
        run: |
          bumper_version="$(mise bumper current)"
          tag="v$bumper_version"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists. Nothing to release."
            exit 0
          fi

          echo "GORELEASER_CURRENT_TAG=$tag" >> $GITHUB_ENV

          notes_file="$(mktemp)"
          echo "RELEASE_NOTES_FILE=$notes_file" >> $GITHUB_ENV
          mise bumper cat --version "$bumper_version" > "$notes_file"

          echo "release=true" >> $GITHUB_OUTPUT

      # GoReleaser works off of git tags, so we need to create and push a tag
      # for the version we got from Bumper
      - name: Create and push tag
        if: ${{ steps.bumper.outputs.release == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${GORELEASER_CURRENT_TAG}"
          git push origin "${GORELEASER_CURRENT_TAG}"

      - name: Run GoReleaser
        if: ${{ steps.bumper.outputs.release == 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes "${{ env.RELEASE_NOTES_FILE }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
