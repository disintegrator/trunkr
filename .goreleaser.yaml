version: 2

project_name: trunkr

builds:
  - main: ./cmd/trunkr
    binary: trunkr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - herdr-plugin.toml

# Release notes come from Bumper (--release-notes in the workflow), which
# replaces git-log changelog generation. Do NOT set disable: true here —
# that skips goreleaser's changelog pipe entirely, including loading the
# --release-notes file, and publishes an empty release body.
changelog:
  disable: false
