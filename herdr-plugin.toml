id = "disintegrator.trunkr"
name = "trunkr"
version = "0.1.1"
min_herdr_version = "0.7.5"
description = "worktrunk worktrees inside herdr: switch, picker, merge, destroy, PR checkout."
platforms = ["linux", "macos"]

# herdr installs are full repo checkouts and cannot exclude files, so the dev
# mise.toml ships untrusted and breaks mise-shimmed tools run from the plugin
# root (#34). Delete it before anything else runs — including go below, which
# may itself be a mise shim. `plugin link` skips build commands, so local
# working trees keep their mise.toml.
[[build]]
command = ["rm", "-f", "mise.toml"]

[[build]]
command = ["go", "build", "-o", "bin/trunkr", "./cmd/trunkr"]

[[actions]]
id = "hello"
title = "trunkr: hello"
description = "Verify trunkr can reach wt and call back into herdr."
contexts = ["global", "workspace", "tab", "pane"]
command = ["bin/trunkr", "hello"]

[[actions]]
id = "switch"
title = "trunkr: switch worktree"
description = "Switch to a worktree (prompts for the branch), focusing its panes or opening one in the configured container."
contexts = ["global", "workspace", "tab", "pane"]
command = ["bin/trunkr", "action", "switch"]

[[actions]]
id = "switch-tab"
title = "trunkr: open worktree in tab"
description = "Open a worktree in a new tab of the current workspace."
contexts = ["global", "workspace", "tab", "pane"]
command = ["bin/trunkr", "action", "switch", "--mode", "tab"]

[[actions]]
id = "switch-workspace"
title = "trunkr: open worktree in workspace"
description = "Open a worktree in a new workspace."
contexts = ["global", "workspace", "tab", "pane"]
command = ["bin/trunkr", "action", "switch", "--mode", "workspace"]

[[actions]]
id = "switch-split"
title = "trunkr: open worktree in split"
description = "Open a worktree in a split of the current pane."
contexts = ["workspace", "tab", "pane"]
command = ["bin/trunkr", "action", "switch", "--mode", "split"]

[[actions]]
id = "create"
title = "trunkr: create worktree"
description = "Create a worktree for a new branch (wt switch --create) and open a pane in it."
contexts = ["global", "workspace", "tab", "pane"]
command = ["bin/trunkr", "action", "create"]

[[actions]]
id = "picker"
title = "trunkr: picker"
description = "Browse worktrees in an overlay: switch, open in tab/workspace/split, create, PR checkout."
contexts = ["global", "workspace", "tab", "pane"]
command = ["bin/trunkr", "action", "picker"]

[[actions]]
id = "merge"
title = "trunkr: merge worktree"
description = "Merge the current worktree's branch into trunk (wt merge), close its panes, and remove the worktree."
contexts = ["tab", "pane"]
command = ["bin/trunkr", "action", "merge"]

[[actions]]
id = "destroy"
title = "trunkr: destroy worktree"
description = "Destroy the current worktree: discard uncommitted changes, close its panes, and remove it (wt remove -f)."
contexts = ["tab", "pane"]
command = ["bin/trunkr", "action", "destroy"]

[[actions]]
id = "pr-checkout"
title = "trunkr: checkout PR"
description = "Check out a pull request into a worktree (wt switch pr:N) and open a pane in it."
contexts = ["global", "workspace", "tab", "pane"]
command = ["bin/trunkr", "action", "pr"]

[[panes]]
id = "picker"
title = "trunkr picker"
description = "Interactive worktree picker: rows show branch, panes, agent status, and git state."
placement = "overlay"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/trunkr\" picker"]

[[panes]]
id = "runner"
title = "trunkr runner"
description = "Streams wt output for switch/create/PR checkout/merge and asks the destroy confirm; auto-closes on success, holds open on failure."
# popup placement must come from the manifest: the 0.7.5 CLI --placement flag
# cannot request popup.
placement = "popup"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/trunkr\" runner"]

[[panes]]
id = "hello-pane"
title = "trunkr hello"
description = "Bubble Tea smoke-test pane."
placement = "overlay"
# Pane commands spawn through the normal pane launcher (PATH resolution, not
# plugin-root-relative like action commands) — hence the $HERDR_PLUGIN_ROOT wrapper.
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/trunkr\" hello-pane"]
